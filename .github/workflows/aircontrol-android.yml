name: Build AirControl Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'artifacts/aircontrol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/aircontrol-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept android-sdk-licenses
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Javascript dependencies
        run: |
          cd artifacts/aircontrol
          pnpm install --no-frozen-lockfile --force
      - name: Assemble installable APK
        run: |
          cd artifacts/aircontrol/android
          ./gradlew clean
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aircontrol-android-apk
          path: artifacts/aircontrol/android/app/build/outputs/apk/release/app-release.apk
          if-no-found-error: error
