name: Build AirControl Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/aircontrol/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/aircontrol-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Assemble installable APK
        run: pnpm --filter @workspace/aircontrol run android:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aircontrol-android-apk
          path: artifacts/aircontrol/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
