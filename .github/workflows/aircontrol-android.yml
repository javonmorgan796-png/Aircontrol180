
name: Build AirControl Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'artifacts/aircontrol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/aircontrol-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify React Native dependencies
        working-directory: artifacts/aircontrol
        run: |
          node -e "console.log('React Native:', require('react-native/package.json').version)"
          node -e "const fs=require('fs'); const p='node_modules/@react-native/gradle-plugin'; console.log('Gradle plugin exists:', fs.existsSync(p)); if (!fs.existsSync(p)) process.exit(1)"
          node -p "require.resolve('@babel/runtime/helpers/interopRequireDefault')"

      - name: Assemble installable APK
        working-directory: artifacts/aircontrol/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aircontrol-android-apk
          path: artifacts/aircontrol/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
